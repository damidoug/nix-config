# Jujutsu (jj) is the VCS. Starship has no native jj module, so show the
# current change here when inside a jj repo: short change id, bookmarks, and
# the first line of the description. `--ignore-working-copy` is essential —
# it stops the prompt from snapshotting (mutating) the repo on every render.
# The built-in git_* modules stay enabled; they only render when a `.git`
# exists, so non-colocated jj repos show just this module.
[custom.jj]
description = "current jj change at @"
when = "jj --ignore-working-copy root"
symbol = " "
style = "bold purple"
format = "on [$symbol$output]($style) "
ignore_timeout = true
command = """
jj --ignore-working-copy log --no-graph --color never -r @ -T 'change_id.shortest(4) ++ " " ++ bookmarks ++ if(description, " " ++ description.first_line(), " (no description)")'
"""
